# Publishes the npm packages — `polymerge-core` (the engine) and `@joshuahurley/polymerge` (the
# CLI, which installs the `polymerge` command and bundles the browser viewer) — when a version
# tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Needs the repository secret NPM_TOKEN (an npm automation / granular access token that can
# publish both packages). The full `npm run verify` gate runs first; nothing is published unless
# it passes. Packages are published with npm provenance (linked to this workflow run).
name: Release

on:
  push:
    # Full version tags only: a floating major tag such as `v1` (for the pull-request action) must not start a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core=$(node -p "require('./packages/core/package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          dep=$(node -p "require('./packages/cli/package.json').dependencies['polymerge-core']")
          echo "tag $tag, polymerge-core $core, @joshuahurley/polymerge $cli (depends on core $dep)"
          [ "$tag" = "$core" ] && [ "$tag" = "$cli" ] && [ "$tag" = "$dep" ] || { echo "::error::tag and package versions differ"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run verify
        run: npm run verify

      # Core first: the CLI depends on the exact core version. A package whose exact version is
      # already on npm is skipped, so a release that failed halfway can be re-run with the same tag.
      # The check compares the version npm prints: depending on the npm version, a missing version
      # either exits non-zero or prints nothing, and neither may count as "published". If the
      # lookup itself fails, the publish is attempted and npm refuses a duplicate version.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for ws in polymerge-core @joshuahurley/polymerge; do
            v=$(npm pkg get version -w "$ws" | node -e "process.stdout.write(Object.values(JSON.parse(require('fs').readFileSync(0,'utf8')))[0])")
            published=$(npm view "$ws@$v" version 2>/dev/null || true)
            if [ "$published" = "$v" ]; then
              echo "$ws@$v is already on npm — skipping"
            else
              echo "publishing $ws@$v"
              npm publish -w "$ws" --provenance --access public
            fi
          done
